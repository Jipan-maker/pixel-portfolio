<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Portofolio | Player 1</title>

        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

        <link href="https://unpkg.com/nes.css/css/nes.min.css" rel="stylesheet"/>

        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>

        <nav class="pixel-nav">
            <a href="{{ url_for('home') }}" class="nes-btn is-warning is-small">Home</a>
            <a href="{{ url_for('about') }}" class="nes-btn is-warning is-small">About</a>
            <a href="{{ url_for('projects') }}" class="nes-btn is-warning is-small">Quest</a>
            <a href="{{ url_for('contact') }}" class="nes-btn is-warning is-small">Contact</a>
        </nav>

        <div style="padding-top: 80px;">
            {% block content %}
            {% endblock %}
        </div>

    <footer style="text-align: center; padding: 30px; margin-top: 50px; border-top: 4px solid white; font-size: 10px;">
        <p>© 2026 Panji Pramudia Bagaskoro</p>
        <div style="display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 15px;">
            <i class="nes-icon snes-jp-logo float-anim"></i>
            <span style="position: relative; top: -20px;">Built using Flask & NES.css</span>
            <i class="nes-icon is-small heart float-anim" style="position: relative; top: -20px;"></i>
        </div>
    </footer>
